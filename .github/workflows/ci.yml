name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            ffmpeg: apt
          - os: ubuntu-latest
            python: "3.13"
            ffmpeg: apt
          - os: macos-latest
            python: "3.13"
            ffmpeg: none
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.ffmpeg == 'apt'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: matrix.ffmpeg == 'none'
        run: echo "AUDIO_BED_CHECK_FFMPEG=/nonexistent/ffmpeg" >> "$GITHUB_ENV"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q -rs
      - run: python -m build
      - name: Install the wheel into a clean venv and run it
        run: |
          python -m venv /tmp/clean && /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/audio-bed-check --version
          /tmp/clean/bin/python -c "import audio_bed_check, pathlib; p = pathlib.Path(audio_bed_check.__file__).parent / 'skills' / 'audio-bed-check' / 'SKILL.md'; assert p.exists(), p"
